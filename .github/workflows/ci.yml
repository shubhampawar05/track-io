name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Tests use this server instead of downloading an in-memory MongoDB binary.
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      # next-env.d.ts and route types are generated (not tracked); create them before tsc.
      - run: npx next typegen
      - run: npx eslint .
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit (production deps)
    runs-on: ubuntu-latest
    # Informational: new advisories appear independently of code changes, so this job
    # reports them without blocking merges. Fix findings in a follow-up PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend
        working-directory: Backend
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend
        working-directory: Frontend
        run: npm audit --omit=dev --audit-level=high
